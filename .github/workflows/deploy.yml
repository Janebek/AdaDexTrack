name: Deploy project website

on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.json
      - static/**
      - videos/**
      - thumbs/**
      - CNAME
      - robots.txt
      - favicon.ico
      - scripts/build_site.py
      - scripts/generate-manifest.mjs
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build website only
        run: python3 scripts/build_site.py --output-dir _site

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
