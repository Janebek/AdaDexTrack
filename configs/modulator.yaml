# Planner2k5 PPO, with the selected 5 cm / 30 degree training perturbations.
env:
  random_time: true
  initial_object_xy_noise: 0.05
  initial_object_yaw_noise_degrees: 30.0
task:
  randomize: true
params:
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: true
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: true
    mlp:
      units:
      - 4096
      - 2048
      - 1024
      - 512
      - 256
      - 128
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
  config:
    name: modulator
    env_name: rlgpu
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 0.0005
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    save_best_after: 5000
    save_frequency: 500
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 8
    mini_epochs: 5
    critic_coef: 4
    clip_value: true
    seq_len: 4
    bounds_loss_coef: 0.0001
