name: TrackingEnv
physics_engine: physx
env:
  numEnvs: 256
  envSpacing: 0.75
  episodeLength: 300
  enableDebugVis: false
  aggregateMode: 1
  numObservations: 273
  reference_manifest: data/adadextrack_full/manifest.csv
  schedule_ornt_rew_coef: false
  cur_ornt_rew_coef: 0.01
  ornt_rew_coef_warm_starting_steps: 30
  ornt_rew_coef_increasing_steps: 130
  lowest_ornt_rew_coef: 0.0
  synthetic_data: false
  label: 0
  pose_save_root: logs/poses
  apply_lag: false
  lag_prob: 0.1
  hand_constraint: true
  clipObservations: 5.0
  clipActions: 1.0
  stiffnessScale: 1.0
  forceLimitScale: 1.0
  random_prior: true
  random_time: false
  repose_z: false
  goal_cond: false
  useRelativeControl: true
  dofSpeedScale: 0.125
  actionsMovingAverage: 1.0
  controlFrequencyInv: 5
  evaluation_save: false
  startPositionNoise: 0.01
  startRotationNoise: 0.0
  resetPositionNoise: 0.01
  resetRotationNoise: 0.0
  resetDofPosRandomInterval: 0.2
  resetDofVelRandomInterval: 0.0
  forceScale: 0.0
  forceProbRange:
  - 0.001
  - 0.1
  forceDecay: 0.99
  forceDecayInterval: 0.08
  distRewardScale: -10.0
  rotRewardScale: 1.0
  rotEps: 0.1
  actionPenaltyScale: -0.0002
  reachGoalBonus: 250
  fallDistance: 0.2
  fallPenalty: -50.0
  objectType: block
  observationType: full_state
  asymmetric_observations: false
  successTolerance: 0.1
  printNumSuccesses: false
  maxConsecutiveSuccesses: 0
  asset:
    assetRoot: assets
    assetFileName: xarm_leap/urdf/xarm_leap.urdf
    assetFileNameBlock: urdf/objects/cube_multicolor.urdf
    assetFileNameBall: urdf/objects/ball.urdf
    assetFileNameEgg: mjcf/open_ai_assets/hand/egg.xml
    assetFileNamePen: mjcf/open_ai_assets/hand/pen.xml
    objectassetFileName: urdf/objects/GRAB/alarmclock/alarmclock.urdf
  enableCameraSensors: false
  transition_scale: 0.5
  orientation_scale: 0.1
  resetTime: -1
task:
  randomize: false
  randomization_params:
    frequency: 1000
    actor_params:
      hand:
        color: true
        dof_properties:
          damping:
            range:
            - 0.7
            - 1.3
            operation: scaling
            distribution: uniform
          stiffness:
            range:
            - 0.7
            - 1.3
            operation: scaling
            distribution: uniform
          lower:
            range:
            - 0
            - 1.0e-05
            operation: additive
            distribution: gaussian
          upper:
            range:
            - 0
            - 1.0e-05
            operation: additive
            distribution: gaussian
sim:
  dt: 0.01667
  substeps: 2
  up_axis: z
  use_gpu_pipeline: true
  gravity:
  - 0.0
  - 0.0
  - -9.81
  physx:
    num_threads: 4
    solver_type: 1
    use_gpu: true
    num_position_iterations: 8
    num_velocity_iterations: 0
    max_gpu_contact_pairs: 8388608
    num_subscenes: 4
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
    contact_collection: 1
