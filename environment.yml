name: adadextrack
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Preview 4 ships native bindings only for Python 3.6-3.8.
  - python=3.8.18
  - pip=24.2
  - setuptools=72.1.0
  - wheel=0.44.0
  - pip:
      # Use the official CUDA 12.1 wheels; CUDA runtime libraries come with torch.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.4.1+cu121
      - torchvision==0.19.1+cu121
      - numpy==1.23.5
      - ninja==1.11.1.1
      - gym==0.23.1
      - scipy==1.10.1
      - PyYAML==6.0.2
      - Pillow==10.4.0
      - imageio==2.35.1
      - psutil==5.9.8
      - tensorboardX==2.6.2.2
      - huggingface-hub==0.13.4
